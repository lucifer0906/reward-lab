# Sparse reward experiment config (Section 25).
# Usage: python -m reward_rl.train --config configs/sparse.yaml

meta:
  name: sparse
  description: "R_sparse baseline: terminal success/failure only (Section 7)"
  seeds: [0, 1, 2, 3, 4]   # 5 seeds per Part 2 decisions

env:
  config: configs/env/base_3keys.yaml

reward:
  type: sparse
  success_reward: 1.0
  timeout_penalty: 0.0   # pure sparse: zero intermediate or terminal-failure signal
  step_cost: 0.0

# PPO hyperparameters (Section 13: fixed across all reward experiments).
# Identical block copied into dense.yaml, potential.yaml, hybrid.yaml
# so the reward formulation is the ONLY experimental variable.
training:
  total_timesteps: 200000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [64, 64]
  eval_freq: 5000       # evaluate every N training steps
  n_eval_episodes: 20   # episodes per evaluation round
  checkpoint_freq: 10000
  log_freq: 1000
