# Hybrid reward experiment config (Section 25).
# Usage: python -m reward_rl.train --config configs/hybrid.yaml

meta:
  name: hybrid
  description: "R_hybrid: dense progress + validity + efficiency + potential + terminal (Section 10)"
  seeds: [0, 1, 2, 3, 4]

env:
  config: configs/env/base_3keys.yaml

reward:
  type: hybrid
  # Dense progress
  key_pickup_reward: 0.2
  door_opened_reward: 0.3
  # Validity
  invalid_action_penalty: -0.05
  # Efficiency
  step_cost: -0.005
  # Potential-based shaping
  gamma: 0.99
  use_potential: true
  # Terminal
  success_reward: 1.0
  timeout_penalty: -0.1

# PPO hyperparameters - IDENTICAL to sparse.yaml (Section 13: only reward changes).
training:
  total_timesteps: 200000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [64, 64]
  eval_freq: 5000
  n_eval_episodes: 20
  checkpoint_freq: 10000
  log_freq: 1000
