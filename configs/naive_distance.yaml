# Stage 5b adversarial reward. PPO settings intentionally match Stage 4 exactly.
meta:
  name: naive_distance
  description: "Adversarial: rewards every decrease in next-target Manhattan distance"
  seeds: [0, 1, 2, 3, 4]

env:
  config: configs/env/base_3keys.yaml

reward:
  type: naive_distance
  distance_decrease_reward: 0.1
  success_reward: 1.0
  timeout_penalty: 0.0

training:
  total_timesteps: 200000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [64, 64]
  eval_freq: 5000
  n_eval_episodes: 20
  checkpoint_freq: 10000
  log_freq: 1000
