# Stage 5b control using reward shaping gamma equal to PPO gamma.
meta:
  name: potential_distance_gamma099
  description: "Distance-potential control: F=0.99*Phi(next)-Phi(current)"
  seeds: [0, 1, 2, 3, 4]
env:
  config: configs/env/base_3keys.yaml
reward:
  type: potential_distance
  gamma: 0.99
  distance_scale: 0.1
  # Affine offset preserves distance differences and makes Phi positive on this grid,
  # so fixed-target oscillations have a small negative return under gamma=0.99.
  distance_baseline: 22.0
  success_reward: 1.0
  timeout_penalty: 0.0
training:
  total_timesteps: 200000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [64, 64]
  eval_freq: 5000
  n_eval_episodes: 20
  checkpoint_freq: 10000
  log_freq: 1000
